<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周边接口监控 - 短信平台监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>📊 监控中心</h1>
        <p>短信平台</p>
      </div>
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab">
          <span class="nav-tab-icon">📈</span> 监控大屏
        </a>
        <a href="business.html" class="nav-tab active">
          <span class="nav-tab-icon">💼</span> 周边监控
        </a>
        <!-- <a href="capacity.html" class="nav-tab">
          <span class="nav-tab-icon">⚡</span> 能力监控
        </a>
        <a href="logs.html" class="nav-tab">
          <span class="nav-tab-icon">📝</span> 日志监控
        </a> -->
        <a href="alerts.html" class="nav-tab">
          <span class="nav-tab-icon">🚨</span> 告警监控
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>周边接口监控</h2>
          <p class="page-subtitle">实时监控周边系统接口调用情况</p>
        </div>
        <button class="btn btn-primary" onclick="openInterfaceModal()">
          <i class="fas fa-plus"></i> 添加接口
        </button>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div class="search-bar">
          <div class="search-item">
            <input type="text" class="search-input" id="searchName" placeholder="搜索接口名称">
          </div>
          <div class="search-item">
            <input type="date" class="search-input" id="searchDate">
          </div>
          <button class="btn btn-primary" onclick="filterInterfaces()">
            <i class="fas fa-search"></i> 搜索
          </button>
          <button class="btn btn-default" onclick="resetSearch()">
            <i class="fas fa-redo"></i> 重置
          </button>
        </div>
      </div>

      <div class="card">
        <table class="table" id="interfaceTable">
          <thead>
            <tr>
              <th>接口名称</th>
              <th>接口地址</th>
              <th>调用时间</th>
              <th>调用次数</th>
              <th>成功次数</th>
              <th>成功率</th>
              <th>当前并发</th>
              <th>Top5错误码</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="interfaceTableBody">
          </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fas fa-inbox"></i>
          <p>暂无配置的接口</p>
          <button class="btn btn-primary" onclick="openInterfaceModal()">添加第一个接口</button>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="interfaceModal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">添加接口</h3>
        <button class="modal-close" onclick="closeInterfaceModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="interfaceForm">
          <input type="hidden" id="interfaceId">
          <div class="form-group">
            <label class="form-label">接口名称</label>
            <input type="text" class="form-input" id="interfaceName" placeholder="例如：用户服务查询" required>
          </div>
          <div class="form-group">
            <label class="form-label">接口地址</label>
            <input type="text" class="form-input" id="interfaceUrl" placeholder="例如：http://api.example.com/user/query" required disabled>
          </div>
          
          <div class="form-actions">
            <button type="button" class="btn btn-default" onclick="closeInterfaceModal()">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .page-header h2 {
      margin: 0;
      font-size: 24px;
      color: #1e293b;
    }
    .page-subtitle {
      margin: 5px 0 0 0;
      color: #64748b;
      font-size: 14px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state i {
      font-size: 48px;
      margin-bottom: 15px;
      color: #cbd5e1;
    }
    .empty-state p {
      margin-bottom: 20px;
      font-size: 14px;
    }
    .error-codes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .error-code-badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .error-code-badge.error {
      background: #fee2e2;
      color: #b91c1c;
    }
    .error-code-badge.warning {
      background: #fef3c7;
      color: #b45309;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .action-btns {
      display: flex;
      gap: 5px;
    }
    .search-input {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      min-width: 150px;
    }
    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .concurrency-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .concurrency-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>

  <script>
    const peripheralInterfaces = [
      {
        id: 1,
        name: '用户服务查询',
        url: 'http://user-service/api/v1/query',
        callTime: '2026-05-21',
        callCount: 158642,
        successCount: 156289,
        currentConcurrency: 128,
        errorCodes: [
          { code: 'E001', count: 1523, type: 'error' },
          { code: 'E002', count: 682, type: 'error' },
          { code: 'W001', count: 148, type: 'warning' }
        ]
      },
      {
        id: 2,
        name: '通道状态同步',
        url: 'http://channel-sync/api/v1/status',
        callTime: '2026-05-21',
        callCount: 89456,
        successCount: 89102,
        currentConcurrency: 45,
        errorCodes: [
          { code: 'E003', count: 298, type: 'error' },
          { code: 'W002', count: 56, type: 'warning' }
        ]
      },
      {
        id: 3,
        name: '计费中心',
        url: 'http://billing/api/v2/charge',
        callTime: '2026-05-20',
        callCount: 67234,
        successCount: 66890,
        currentConcurrency: 32,
        errorCodes: [
          { code: 'E004', count: 289, type: 'error' },
          { code: 'E005', count: 55, type: 'error' }
        ]
      }
    ];

    function filterInterfaces() {
      const searchName = document.getElementById('searchName').value.toLowerCase();
      const searchDate = document.getElementById('searchDate').value;
      
      const filtered = peripheralInterfaces.filter(item => {
        const matchName = item.name.toLowerCase().includes(searchName);
        const matchDate = !searchDate || item.callTime === searchDate;
        return matchName && matchDate;
      });
      
      renderInterfaceTable(filtered);
    }

    function resetSearch() {
      document.getElementById('searchName').value = '';
      document.getElementById('searchDate').value = '';
      renderInterfaceTable(peripheralInterfaces);
    }

    function renderInterfaceTable(data = peripheralInterfaces) {
      const tbody = document.getElementById('interfaceTableBody');
      const emptyState = document.getElementById('emptyState');
      const table = document.getElementById('interfaceTable');

      if (data.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.querySelector('p').textContent = '未找到匹配的接口';
        return;
      }

      table.style.display = 'table';
      emptyState.style.display = 'none';

      tbody.innerHTML = data.map(item => {
        const successRate = item.callCount > 0 
          ? ((item.successCount / item.callCount) * 100).toFixed(2) + '%' 
          : '0.00%';
        
        const sortedErrorCodes = [...item.errorCodes].sort((a, b) => b.count - a.count);
        const top5ErrorCodes = sortedErrorCodes.slice(0, 5);
        const errorCodesHtml = top5ErrorCodes.length > 0 
          ? top5ErrorCodes.map(ec => `
              <span class="error-code-badge ${ec.type}">${ec.code}(${ec.count})</span>
            `).join('')
          : '-';

        return `
          <tr>
            <td><strong>${item.name}</strong></td>
            <td style="font-size: 12px; color: #64748b; max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${item.url}</td>
            <td>${item.callTime}</td>
            <td>${item.callCount.toLocaleString()}</td>
            <td>${item.successCount.toLocaleString()}</td>
            <td><span class="tag ${parseFloat(successRate) >= 99 ? 'tag-success' : 'tag-warning'}">${successRate}</span></td>
            <td>
              <span class="concurrency-badge">
                <span class="concurrency-dot"></span>
                ${item.currentConcurrency}
              </span>
            </td>
            <td><div class="error-codes">${errorCodesHtml}</div></td>
            <td>
              <div class="action-btns">
                <button class="btn-icon" onclick="editInterface(${item.id})" title="编辑">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn-icon btn-danger" onclick="deleteInterface(${item.id})" title="删除">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openInterfaceModal(id = null) {
      const modal = document.getElementById('interfaceModal');
      const title = document.getElementById('modalTitle');
      const form = document.getElementById('interfaceForm');
      
      form.reset();

      if (id) {
        title.textContent = '编辑接口';
        const item = peripheralInterfaces.find(i => i.id === id);
        if (item) {
          document.getElementById('interfaceId').value = item.id;
          document.getElementById('interfaceName').value = item.name;
          document.getElementById('interfaceUrl').value = item.url;
        }
      } else {
        title.textContent = '添加接口';
      }

      modal.style.display = 'flex';
    }

    function closeInterfaceModal() {
      document.getElementById('interfaceModal').style.display = 'none';
    }

    function editInterface(id) {
      openInterfaceModal(id);
    }

    function deleteInterface(id) {
      if (confirm('确定要删除该接口配置吗？')) {
        const index = peripheralInterfaces.findIndex(i => i.id === id);
        if (index > -1) {
          peripheralInterfaces.splice(index, 1);
          filterInterfaces();
        }
      }
    }

    document.getElementById('interfaceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const id = document.getElementById('interfaceId').value;
      const name = document.getElementById('interfaceName').value.trim();
      const url = document.getElementById('interfaceUrl').value.trim();

      if (!name || !url) {
        alert('请填写完整的接口信息');
        return;
      }

      if (id) {
        const index = peripheralInterfaces.findIndex(i => i.id === parseInt(id));
        if (index > -1) {
          peripheralInterfaces[index].name = name;
          peripheralInterfaces[index].url = url;
        }
      } else {
        const newId = peripheralInterfaces.length > 0 
          ? Math.max(...peripheralInterfaces.map(i => i.id)) + 1 
          : 1;
        peripheralInterfaces.push({
          id: newId,
          name: name,
          url: url,
          callTime: new Date().toISOString().split('T')[0],
          callCount: 0,
          successCount: 0,
          currentConcurrency: 0,
          errorCodes: []
        });
      }

      closeInterfaceModal();
      filterInterfaces();
    });

    document.getElementById('interfaceModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeInterfaceModal();
      }
    });

    filterInterfaces();
  </script>
</body>
</html>
