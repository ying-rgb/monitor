<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警监控 - 短信平台监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>📊 监控中心</h1>
        <p>短信平台</p>
      </div>
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab">
          <span class="nav-tab-icon">📈</span> 监控大屏
        </a>
        <a href="business.html" class="nav-tab">
          <span class="nav-tab-icon">💼</span> 周边监控
        </a>
        <a href="alerts.html" class="nav-tab active">
          <span class="nav-tab-icon">🚨</span> 告警监控
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>告警监控</h2>
          <p class="page-subtitle">管理和查看系统告警</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="openConfigSidebar()">
            <i class="fas fa-user-cog"></i> 配置接收人
          </button>
        </div>
      </div>

      <div class="alert-stats">
        <div class="stat-item">
          <div class="stat-icon total"><i class="fas fa-bell"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="totalCount">8</div>
            <div class="stat-label">总告警数</div>
          </div>
          <div class="stat-trend up"><i class="fas fa-arrow-up"></i> +5</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon critical"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="criticalCount">3</div>
            <div class="stat-label">严重告警</div>
          </div>
          <div class="stat-trend up"><i class="fas fa-arrow-up"></i> +2</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon warning"><i class="fas fa-exclamation-circle"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="warningCount">3</div>
            <div class="stat-label">一般告警</div>
          </div>
          <div class="stat-trend down"><i class="fas fa-arrow-down"></i> -5</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon info"><i class="fas fa-info-circle"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="infoCount">2</div>
            <div class="stat-label">提示告警</div>
          </div>
          <div class="stat-trend up"><i class="fas fa-arrow-up"></i> +3</div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div class="search-bar">
          <div class="search-item">
            <select class="search-select" id="levelFilter">
              <option value="">全部级别</option>
              <option value="critical">严重</option>
              <option value="warning">一般</option>
              <option value="info">提示</option>
            </select>
          </div>
          <div class="search-item">
            <select class="search-select" id="typeGroupFilter">
              <option value="">全部类型组</option>
              <option value="system">系统告警</option>
              <option value="business">业务告警</option>
              <option value="peripheral">周边告警</option>
            </select>
          </div>
          <div class="search-item">
            <input type="text" class="search-input" id="keywordSearch" placeholder="搜索关键字">
          </div>
          <div class="search-item">
            <input type="text" class="search-input" id="moduleSearch" placeholder="搜索模块">
          </div>
          <div class="search-item">
            <input type="date" class="search-input" id="startDate" placeholder="开始日期">
          </div>
          <div class="search-item">
            <input type="date" class="search-input" id="endDate" placeholder="结束日期">
          </div>
          <div class="search-actions">
            <button class="btn btn-primary" onclick="filterAlerts()">查询</button>
            <button class="btn btn-default" onclick="resetFilters()">重置</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">告警列表</h3>
          <div class="card-actions">
            <button class="btn btn-default" onclick="showAllAlerts()">全部</button>
            <button class="btn btn-danger" onclick="filterByLevel('critical')">严重</button>
            <button class="btn btn-warning" onclick="filterByLevel('warning')">一般</button>
            <button class="btn btn-info" onclick="filterByLevel('info')">提示</button>
          </div>
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>时间</th>
                <th>级别</th>
                <th>类型组</th>
                <th>类型</th>
                <th>关键字</th>
                <th>模块</th>
                <th>告警内容</th>
              </tr>
            </thead>
            <tbody id="alertsTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="config-sidebar" id="configSidebar">
    <div class="sidebar-overlay" onclick="closeConfigSidebar()"></div>
    <div class="sidebar-content">
      <div class="sidebar-header">
        <h3><i class="fas fa-bell"></i> 告警接收人配置</h3>
        <button class="close-btn" onclick="closeConfigSidebar()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="sidebar-body">
        <div class="table-container">
          <table class="config-table">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAllConfig" onclick="toggleSelectAll()"></th>
                <th>消息类型组</th>
                <th>消息类型</th>
                <th>接收渠道</th>
                <th>消息接收人</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="configTableBody">
            </tbody>
          </table>
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-primary" onclick="openAddModal()">新增</button>
        <button class="btn btn-danger" onclick="deleteSelectedConfigs()">批量删除</button>
      </div>
    </div>
  </div>

  <div class="edit-modal" id="editModal">
    <div class="modal-overlay" onclick="closeEditModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-edit"></i> <span id="modalTitle">编辑告警配置</span></h3>
        <button class="close-btn" onclick="closeEditModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>消息类型组</label>
          <select class="form-select" id="editTypeGroup" onchange="updateEditTypeOptions()">
            <option value="">请选择类型组</option>
            <option value="system">系统告警</option>
            <option value="business">业务告警</option>
            <option value="peripheral">周边告警</option>
          </select>
        </div>
        <div class="form-group">
          <label>消息类型</label>
          <select class="form-select" id="editType">
            <option value="">请选择类型组后选择</option>
          </select>
        </div>
        <div class="form-group">
          <label>接收渠道</label>
          <div class="channel-options">
            <label class="channel-option">
              <input type="checkbox" name="editChannel" value="短信">
              <span><i class="fas fa-mobile-alt"></i> 短信</span>
            </label>
            <label class="channel-option">
              <input type="checkbox" name="editChannel" value="邮件">
              <span><i class="fas fa-envelope"></i> 邮件</span>
            </label>
            <label class="channel-option">
              <input type="checkbox" name="editChannel" value="钉钉">
              <span><i class="fas fa-comments"></i> 钉钉</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>消息接收人</label>
          <div class="receivers-section">
            <div class="receivers-list" id="editReceiversList">
            </div>
            <div style="display: flex; gap: 10px;">
              <button class="btn btn-primary btn-sm" onclick="addReceiverRow()">
                <i class="fas fa-plus"></i> 添加接收人
              </button>
              <button class="btn btn-default btn-sm" onclick="openExistingReceiversModal()">
                <i class="fas fa-users"></i> 已有接收人
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeEditModal()">取消</button>
        <button class="btn btn-primary" onclick="saveEditModal()">保存</button>
      </div>
    </div>
  </div>

  <div class="edit-modal" id="existingReceiversModal" style="z-index: 4000;">
    <div class="modal-overlay" onclick="closeExistingReceiversModal()"></div>
    <div class="modal-content" style="width: 600px;">
      <div class="modal-header">
        <h3><i class="fas fa-users"></i> 选择已有接收人</h3>
        <button class="close-btn" onclick="closeExistingReceiversModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="search-item" style="margin-bottom: 15px;">
          <input type="text" class="search-input" id="searchExistingReceiver" placeholder="搜索姓名、邮箱或手机" oninput="filterExistingReceivers()">
        </div>
        <div class="existing-receivers-list" id="existingReceiversList">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeExistingReceiversModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmAddExistingReceivers()">添加选中</button>
      </div>
    </div>
  </div>

    const alertsData = [
      {
        id: 1,
        level: 'warning',
        typeGroup: 'business',
        type: 'messageQueue',

        content: '10682341通道消息队列堵塞90%，超过阈值80%，请关注'

      {
        id: 2,
        level: 'critical',
        typeGroup: 'business',

        content: '通道A在过去5分钟内发送失败率达到15.3%，超过了10%的告警阈值。请检查通道状态和网络连接。'

        typeGroup: 'business',
        type: 'requestFrequency',
        keyword: '客户C请求频率异常',

    const typeGroupMap = {
      system: '系统告警',
      business: '业务告警',
      peripheral: '周边告警'
    };

    const typeMap = {
      system: {
        memory: '内存',
        database: '数据库',
        taskDelay: '定时任务'
      },
      business: {
        messageQueue: '消息队列',
        sendFailed: '发送失败',
        connection: '连接异常',
        requestFrequency: '请求频率'
      },
      peripheral: {
        apiResponse: 'API响应',
        network: '网络异常'
      }
    };

    function getLevelText(level) {
      const map = { critical: '严重', warning: '一般', info: '提示' };
      return map[level] || level;
    }

    function getLevelClass(level) {
      const map = { critical: 'tag-danger', warning: 'tag-warning', info: 'tag-info' };
      return map[level] || level;
    }

    function getTypeGroupText(typeGroup) {
      return typeGroupMap[typeGroup] || typeGroup;
    }

    function getTypeText(typeGroup, type) {
      return typeMap[typeGroup] && typeMap[typeGroup][type] ? typeMap[typeGroup][type] : type;
    }

    function renderAlerts(data = alertsData) {
      const tbody = document.getElementById('alertsTableBody');
      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${item.time}</td>
          <td><span class="${getLevelClass(item.level)}">${getLevelText(item.level)}</span></td>
          <td>${getTypeGroupText(item.typeGroup)}</td>
          <td>${getTypeText(item.typeGroup, item.type)}</td>
          <td><strong>${item.keyword}</strong></td>
          <td>${item.module}</td>
          <td class="content-cell">${item.content}</td>
        </tr>
      `).join('');

      updateStats(data);
    }

    function updateStats(data) {
      const total = data.length;
      const critical = data.filter(a => a.level === 'critical').length;
      const warning = data.filter(a => a.level === 'warning').length;
      const info = data.filter(a => a.level === 'info').length;
      
      document.getElementById('totalCount').textContent = total;
      document.getElementById('criticalCount').textContent = critical;
      document.getElementById('warningCount').textContent = warning;
      document.getElementById('infoCount').textContent = info;
    }

    function filterAlerts() {
      const level = document.getElementById('levelFilter').value;
      const typeGroup = document.getElementById('typeGroupFilter').value;
      const keyword = document.getElementById('keywordSearch').value.toLowerCase();
      const module = document.getElementById('moduleSearch').value.toLowerCase();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let filtered = alertsData;

      if (level) {
        filtered = filtered.filter(a => a.level === level);
      }
      if (typeGroup) {
        filtered = filtered.filter(a => a.typeGroup === typeGroup);
      }
      if (keyword) {
        filtered = filtered.filter(a => a.keyword.toLowerCase().includes(keyword) || 
                                        a.content.toLowerCase().includes(keyword));
      }
      if (module) {
        filtered = filtered.filter(a => a.module.toLowerCase().includes(module));
      }
      if (startDate) {
        filtered = filtered.filter(a => a.time.split(' ')[0] >= startDate);
      }
      if (endDate) {
        filtered = filtered.filter(a => a.time.split(' ')[0] <= endDate);
      }

      renderAlerts(filtered);
    }

    function resetFilters() {
      document.getElementById('levelFilter').value = '';
      document.getElementById('typeGroupFilter').value = '';
      document.getElementById('keywordSearch').value = '';
      document.getElementById('moduleSearch').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      renderAlerts(alertsData);
    }

    function filterByLevel(level) {
      document.getElementById('levelFilter').value = level;
      filterAlerts();
    }

    function showAllAlerts() {
      resetFilters();
    }

    let currentEditIndex = -1;

    function openConfigSidebar() {
      document.getElementById('configSidebar').classList.add('show');
      renderConfigTable();
    }

    function closeConfigSidebar() {
      document.getElementById('configSidebar').classList.remove('show');
    }

    function renderConfigTable() {
      const tbody = document.getElementById('configTableBody');
      tbody.innerHTML = configData.map((item, index) => `
        <tr>
          <td><input type="checkbox" class="config-checkbox" data-id="${item.id}"></td>
          <td>${getTypeGroupText(item.typeGroup)}</td>
          <td>${getTypeText(item.typeGroup, item.type)}</td>
          <td>
            ${item.channels.map(ch => `<span class="channel-badge"><i class="fas fa-check"></i> ${ch}</span>`).join('')}
          </td>
          <td>${item.receivers.map(r => r.name).join('、')}</td>
          <td>
            <button class="config-btn config-btn-edit" onclick="openEditModal(${index})">编辑</button>
            <button class="config-btn config-btn-delete" onclick="deleteConfig(${index})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    function toggleSelectAll() {
      const selectAll = document.getElementById('selectAllConfig');
      const checkboxes = document.querySelectorAll('.config-checkbox');
      checkboxes.forEach(cb => cb.checked = selectAll.checked);
    }

    function openAddModal() {
      currentEditIndex = -1;
      document.getElementById('modalTitle').textContent = '新增告警配置';
      document.getElementById('editTypeGroup').value = '';
      document.getElementById('editType').innerHTML = '<option value="">请选择类型组后选择</option>';
      document.querySelectorAll('input[name="editChannel"]').forEach(cb => cb.checked = false);
      document.getElementById('editReceiversList').innerHTML = '';
      addReceiverRow();
      document.getElementById('editModal').classList.add('show');
    }

    function openEditModal(index) {
      currentEditIndex = index;
      const config = configData[index];
      document.getElementById('modalTitle').textContent = '编辑告警配置';
      
      document.getElementById('editTypeGroup').value = config.typeGroup;
      updateEditTypeOptions();
      document.getElementById('editType').value = config.type;
      
      document.querySelectorAll('input[name="editChannel"]').forEach(cb => {
        cb.checked = config.channels.includes(cb.value);
      });
      
      renderEditReceivers(config.receivers);
      
      document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('show');
      currentEditIndex = -1;
    }

    function updateEditTypeOptions() {
      const typeGroup = document.getElementById('editTypeGroup').value;
      const typeSelect = document.getElementById('editType');
      
      if (!typeGroup || !typeMap[typeGroup]) {
        typeSelect.innerHTML = '<option value="">请选择类型组</option>';
        return;
      }

      const types = typeMap[typeGroup];
      let options = '<option value="">全部类型</option>';
      for (const [key, value] of Object.entries(types)) {
        options += `<option value="${key}">${value}</option>`;
      }
      typeSelect.innerHTML = options;
    }

    function renderEditReceivers(receivers) {
      const container = document.getElementById('editReceiversList');
      container.innerHTML = receivers.map((r) => `
        <div class="receiver-row">
          <input type="text" placeholder="姓名" value="${r.name}">
          <input type="text" placeholder="邮箱" value="${r.email}">
          <input type="text" placeholder="手机" value="${r.phone}">
          <button class="remove-receiver" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
        </div>
      `).join('');
    }

    function addReceiverRow() {
      const container = document.getElementById('editReceiversList');
      container.innerHTML += `
        <div class="receiver-row">
          <input type="text" placeholder="姓名">
          <input type="text" placeholder="邮箱">
          <input type="text" placeholder="手机">
          <button class="remove-receiver" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
        </div>
      `;
    }

    function removeEditReceiver(index) {
      const rows = document.querySelectorAll('#editReceiversList .receiver-row');
      if (rows[index]) {
        rows[index].remove();
      }
    }

    function saveEditModal() {
      const typeGroup = document.getElementById('editTypeGroup').value;
      const type = document.getElementById('editType').value;
      const channels = Array.from(document.querySelectorAll('input[name="editChannel"]:checked')).map(cb => cb.value);
      
      const receiverRows = document.querySelectorAll('#editReceiversList .receiver-row');
      const receivers = Array.from(receiverRows).map(row => ({
        name: row.children[0].value,
        email: row.children[1].value,
        phone: row.children[2].value
      })).filter(r => r.name || r.email || r.phone);
      
      if (!typeGroup) {
        alert('请选择消息类型组');
        return;
      }
      if (!type) {
        alert('请选择消息类型');
        return;
      }
      if (channels.length === 0) {
        alert('请选择至少一个接收渠道');
        return;
      }
      if (receivers.length === 0) {
        alert('请添加至少一个接收人');
        return;
      }
      
      if (currentEditIndex === -1) {
        configData.push({
          id: Date.now(),
          typeGroup,
          type,
          channels,
          receivers
        });
      } else {
        configData[currentEditIndex] = {
          id: configData[currentEditIndex].id,
          typeGroup,
          type,
          channels,
          receivers
        };
      }
      
      renderConfigTable();
      closeEditModal();
      alert('配置已保存！');
    }

    function deleteSelectedConfigs() {
      const checked = document.querySelectorAll('.config-checkbox:checked');
      if (checked.length === 0) {
        alert('请选择要删除的配置');
        return;
      }
      if (confirm(`确定要删除选中的 ${checked.length} 条配置吗？`)) {
        const idsToDelete = Array.from(checked).map(cb => parseInt(cb.dataset.id));
        configData = configData.filter(item => !idsToDelete.includes(item.id));
        renderConfigTable();
      }
    }

    function deleteConfig(index) {
      if (confirm('确定要删除这条配置吗？')) {
        configData.splice(index, 1);
        renderConfigTable();
      }
    }

    function saveConfigs() {
      alert('配置已保存！');
    }

    function getAllExistingReceivers() {
      const receiversMap = new Map();
      configData.forEach(config => {
        config.receivers.forEach(receiver => {
          const key = `${receiver.name}_${receiver.email}_${receiver.phone}`;
          if (!receiversMap.has(key)) {
            receiversMap.set(key, receiver);
          }
        });
      });
      return Array.from(receiversMap.values());
    }

    function openExistingReceiversModal() {
      document.getElementById('searchExistingReceiver').value = '';
      renderExistingReceivers();
      document.getElementById('existingReceiversModal').classList.add('show');
    }

    function closeExistingReceiversModal() {
      document.getElementById('existingReceiversModal').classList.remove('show');
    }

    function renderExistingReceivers(filterText = '') {
      const receivers = getAllExistingReceivers();
      const filtered = receivers.filter(r => {
        if (!filterText) return true;
        const text = filterText.toLowerCase();
        return r.name.toLowerCase().includes(text) ||
               r.email.toLowerCase().includes(text) ||
               r.phone.includes(text);
      });

      const container = document.getElementById('existingReceiversList');
      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">暂无符合条件的接收人</div>';
        return;
      }

      container.innerHTML = filtered.map((r, index) => `
        <div class="existing-receiver-item" onclick="toggleExistingReceiverSelect(${index})">
          <input type="checkbox" class="existing-receiver-checkbox" data-index="${index}">
          <div class="existing-receiver-info">
            <div class="existing-receiver-name">${r.name}</div>
            <div class="existing-receiver-contact">${r.email} | ${r.phone}</div>
          </div>
        </div>
      `).join('');
    }

    function filterExistingReceivers() {
      const filterText = document.getElementById('searchExistingReceiver').value;
      renderExistingReceivers(filterText);
    }

    function toggleExistingReceiverSelect(index) {
      const checkbox = document.querySelector(`.existing-receiver-checkbox[data-index="${index}"]`);
      if (checkbox) {
        checkbox.checked = !checkbox.checked;
        const item = checkbox.parentElement;
        item.classList.toggle('selected', checkbox.checked);
      }
    }

    function confirmAddExistingReceivers() {
      const checked = document.querySelectorAll('.existing-receiver-checkbox:checked');
      if (checked.length === 0) {
        alert('请选择要添加的接收人');
        return;
      }

      const receivers = getAllExistingReceivers();
      const selectedReceivers = Array.from(checked).map(cb => receivers[parseInt(cb.dataset.index)]);
      
      const container = document.getElementById('editReceiversList');
      selectedReceivers.forEach(r => {
        container.innerHTML += `
          <div class="receiver-row">
            <input type="text" placeholder="姓名" value="${r.name}">
            <input type="text" placeholder="邮箱" value="${r.email}">
            <input type="text" placeholder="手机" value="${r.phone}">
            <button class="remove-receiver" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
          </div>
        `;
      });

      closeExistingReceiversModal();
      alert(`已添加 ${selectedReceivers.length} 位接收人`);
    }

    renderAlerts(alertsData);
  </script>
