<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警监控 - 短信平台监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>📊 监控中心</h1>
        <p>短信平台</p>
      </div>
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab">
          <span class="nav-tab-icon">📈</span> 监控大屏
        </a>
        <a href="business.html" class="nav-tab">
          <span class="nav-tab-icon">💼</span> 周边监控
        </a>
        <!-- <a href="capacity.html" class="nav-tab">
          <span class="nav-tab-icon">⚡</span> 能力监控
        </a>
        <a href="logs.html" class="nav-tab">
          <span class="nav-tab-icon">📝</span> 日志监控
        </a> -->
        <a href="alerts.html" class="nav-tab active">
          <span class="nav-tab-icon">🚨</span> 告警监控
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>告警监控</h2>
          <p class="page-subtitle">管理和查看系统告警</p>
        </div>
      </div>

      <div class="alert-stats">
        <div class="stat-item">
          <div class="stat-icon total"><i class="fas fa-bell"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="totalCount">8</div>
            <div class="stat-label">总告警数</div>
          </div>
          <div class="stat-trend up"><i class="fas fa-arrow-up"></i> +5</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon critical"><i class="fas fa-exclamation-triangle"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="criticalCount">3</div>
            <div class="stat-label">严重告警</div>
          </div>
          <div class="stat-trend up"><i class="fas fa-arrow-up"></i> +2</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon warning"><i class="fas fa-exclamation-circle"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="warningCount">3</div>
            <div class="stat-label">警告告警</div>
          </div>
          <div class="stat-trend down"><i class="fas fa-arrow-down"></i> -5</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon info"><i class="fas fa-info-circle"></i></div>
          <div class="stat-content">
            <div class="stat-count" id="infoCount">2</div>
            <div class="stat-label">信息告警</div>
          </div>
          <div class="stat-trend up"><i class="fas fa-arrow-up"></i> +3</div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div class="search-bar">
          <div class="search-item">
            <select class="search-select" id="levelFilter">
              <option value="">全部级别</option>
              <option value="critical">严重</option>
              <option value="warning">警告</option>
              <option value="info">信息</option>
            </select>
          </div>
          <div class="search-item">
            <input type="text" class="search-input" id="keywordSearch" placeholder="搜索告警标题">
          </div>
           <div class="search-item">
            <input type="text" class="search-input" id="keywordSearch" placeholder="搜索客户">
          </div>
           <div class="search-item">
            <input type="text" class="search-input" id="keywordSearch" placeholder="搜索通道">
          </div>
          <div class="search-item">
            <input type="date" class="search-input" id="startDate" placeholder="开始日期">
          </div>
          <div class="search-item">
            <input type="date" class="search-input" id="endDate" placeholder="结束日期">
          </div>
          <div class="search-actions">
            <button class="btn btn-primary" onclick="filterAlerts()">查询</button>
            <button class="btn btn-default" onclick="resetFilters()">重置</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">告警列表</h3>
          <div class="card-actions">
            <button class="btn btn-default" onclick="showAllAlerts()">全部</button>
            <button class="btn btn-danger" onclick="filterByLevel('critical')">严重</button>
            <button class="btn btn-warning" onclick="filterByLevel('warning')">警告</button>
            <button class="btn btn-info" onclick="filterByLevel('info')">信息</button>
          </div>
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>日期</th>
                <th>时间</th>
                <th>级别</th>
                <th>标题</th>
                <th>客户</th>
                <th>发送账号</th>
                <th>通道商</th>
                <th>通道</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="alertsTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="alertDetailModal" style="display: none;">
    <div class="modal-content" style="max-width: 900px;">
      <div class="modal-header">
        <h3 class="modal-title">告警详情</h3>
        <button class="modal-close" onclick="closeAlertDetailModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body" id="alertDetailBody">
      </div>
    </div>
  </div>

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .page-header h2 {
      margin: 0;
      font-size: 24px;
      color: #1e293b;
    }
    .page-subtitle {
      margin: 5px 0 0 0;
      color: #64748b;
      font-size: 14px;
    }
    .alert-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-item {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: #f8fafc;
      border-radius: 8px;
      gap: 12px;
      border-left: 4px solid #64748b;
    }
    .stat-icon {
      font-size: 28px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
    }
    .stat-icon.total {
      color: #64748b;
      background: #e2e8f0;
    }
    .stat-icon.critical {
      color: #dc2626;
      background: #fecaca;
      border-left-color: #dc2626;
    }
    .stat-icon.warning {
      color: #f59e0b;
      background: #fef3c7;
    }
    .stat-icon.info {
      color: #3b82f6;
      background: #bfdbfe;
    }
    .stat-content {
      flex: 1;
    }
    .stat-count {
      font-size: 28px;
      font-weight: bold;
      color: #1e293b;
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
    }
    .stat-trend {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 12px;
    }
    .stat-trend.up {
      background: #dcfce7;
      color: #166534;
    }
    .stat-trend.down {
      background: #fee2e2;
      color: #991b1b;
    }
    .search-input {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      min-width: 150px;
    }
    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .card-actions {
      display: flex;
      gap: 8px;
    }
    .card-actions .btn {
      padding: 6px 14px;
      font-size: 12px;
    }
    .btn-danger {
      background: #dc2626;
      color: white;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .btn-warning {
      background: #f59e0b;
      color: white;
    }
    .btn-warning:hover {
      background: #d97706;
    }
    .btn-info {
      background: #3b82f6;
      color: white;
    }
    .btn-info:hover {
      background: #2563eb;
    }
    .btn-outline {
      background: transparent;
      color: #3b82f6;
      border: 1px solid #3b82f6;
    }
    .btn-outline:hover {
      background: #eff6ff;
    }
    .table-container {
      overflow-x: auto;
    }
    .alert-detail-section {
      margin-bottom: 16px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
    }
    .alert-detail-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .alert-detail-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .alert-detail-value {
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
    }
    .alert-detail-desc {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
    }
    .alert-timeline {

      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    .alert-timeline-item {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      position: relative;
    }
    .alert-timeline-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 14px;
      width: 2px;
      height: calc(100% + 2px);
      background: #cbd5e1;
    }
    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3b82f6;
      margin-top: 4px;
      flex-shrink: 0;
      z-index: 1;
    }
    .timeline-dot.first {
      background: #dc2626;
    }
    .timeline-dot.last {
      background: #10b981;
    }
    .timeline-content {
      flex: 1;
    }
    .timeline-time {
      font-size: 12px;
      color: #94a3b8;
    }
    .timeline-text {
      font-size: 13px;
      color: #374151;
    }
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-pending {
      background: #fee2e2;
      color: #dc2626;
    }
    .status-processing {
      background: #fef3c7;
      color: #d97706;
    }
    .status-resolved {
      background: #dcfce7;
      color: #166534;
    }
    .tag-danger {
      background: #fee2e2;
      color: #dc2626;
    }
    .tag-warning {
      background: #fef3c7;
      color: #d97706;
    }
    .tag-info {
      background: #dbeafe;
      color: #2563eb;
    }
    .log-section {
      margin-top: 20px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-section h4 {
      color: #e2e8f0;
      margin: 0 0 12px 0;
      font-size: 14px;
    }
    .log-item {
      color: #94a3b8;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
    }
    .log-item:last-child {
      border-bottom: none;
    }
    .log-time {
      color: #64748b;
      margin-right: 8px;
    }
    .log-level {
      display: inline-block;
      width: 50px;
      text-align: center;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 10px;
      margin-right: 8px;
    }
    .log-level.ERROR {
      background: #dc2626;
      color: white;
    }
    .log-level.WARN {
      background: #f59e0b;
      color: white;
    }
    .log-level.INFO {
      background: #3b82f6;
      color: white;
    }
    .status-flow {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
    }
    .status-flow h4 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #1e293b;
    }
    .status-flow-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }
    .status-flow-steps {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      padding-left: 20px;
    }
    .status-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .status-step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 25px;
      width: calc(100% + 20px);
      height: 2px;
      background: #cbd5e1;
    }
    .status-step-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 1;
      background: #e2e8f0;
      color: #64748b;
    }
    .status-step.active .status-step-circle {
      background: #3b82f6;
      color: white;
    }
    .status-step.done .status-step-circle {
      background: #10b981;
      color: white;
    }
    .status-step-label {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    function getLevelText(level) {
      const map = { critical: '严重', warning: '警告', info: '信息' };
      return map[level] || level;
    }

    function getLevelClass(level) {
      const map = { critical: 'tag-danger', warning: 'tag-warning', info: 'tag-info' };
      return map[level] || 'tag';
    }

    function renderAlerts(data = alertsData) {
      const tbody = document.getElementById('alertsTableBody');
      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${item.time.split(' ')[0]}</td>
          <td>${item.time.split(' ')[1]}</td>
          <td><span class="tag ${getLevelClass(item.level)}">${getLevelText(item.level)}</span></td>
          <td><strong>${item.title}</strong></td>
          <td>${item.customer || '-'}</td>
          <td>${item.account || '-'}</td>
          <td>${item.channelProvider || '-'}</td>
          <td>${item.channel}</td>
          <td>
            <button class="btn btn-default" onclick="showAlertDetail(${item.id})">详情</button>
          </td>
        </tr>
      `).join('');

      updateStats(data);
    }

    function updateStats(data) {
      const total = data.length;
      const critical = data.filter(a => a.level === 'critical').length;
      const warning = data.filter(a => a.level === 'warning').length;
      const info = data.filter(a => a.level === 'info').length;
      
      document.getElementById('totalCount').textContent = total;
      document.getElementById('criticalCount').textContent = critical;
      document.getElementById('warningCount').textContent = warning;
      document.getElementById('infoCount').textContent = info;
    }

    function filterAlerts() {
      const level = document.getElementById('levelFilter').value;
      const keyword = document.getElementById('keywordSearch').value.toLowerCase();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let filtered = alertsData;

      if (level) {
        filtered = filtered.filter(a => a.level === level);
      }
      if (keyword) {
        filtered = filtered.filter(a => a.title.toLowerCase().includes(keyword) || 
                                        a.channel.toLowerCase().includes(keyword) ||
                                        a.customer.toLowerCase().includes(keyword));
      }
      if (startDate) {
        filtered = filtered.filter(a => a.time.split(' ')[0] >= startDate);
      }
      if (endDate) {
        filtered = filtered.filter(a => a.time.split(' ')[0] <= endDate);
      }

      renderAlerts(filtered);
    }

    function resetFilters() {
      document.getElementById('levelFilter').value = '';
      document.getElementById('keywordSearch').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      renderAlerts(alertsData);
    }

    function filterByLevel(level) {
      document.getElementById('levelFilter').value = level;
      filterAlerts();
    }

    function showAllAlerts() {
      resetFilters();
    }

    function showAlertDetail(id) {
      const alert = alertsData.find(a => a.id === id);
      if (!alert) return;

      const logsHtml = alert.logs.map(log => `
        <div class="log-item">
          <span class="log-time">[${log.time}]</span>
          <span class="log-level ${log.level}">${log.level}</span>
          ${log.message}
        </div>
      `).join('');

      const html = `
        <div class="alert-detail-row">
          <div class="alert-detail-section">
            <div class="alert-detail-label">告警级别</div>
            <div class="alert-detail-value">
              <span class="tag ${getLevelClass(alert.level)}">${getLevelText(alert.level)}</span>
            </div>
          </div>
          <div class="alert-detail-section">
            <div class="alert-detail-label">严重程度</div>
            <div class="alert-detail-value">${alert.severity}</div>
          </div>
        </div>
        <div class="alert-detail-row">
          <div class="alert-detail-section">
            <div class="alert-detail-label">告警标题</div>
            <div class="alert-detail-value">${alert.title}</div>
          </div>
          <div class="alert-detail-section">
            <div class="alert-detail-label">告警分类</div>
            <div class="alert-detail-value">${alert.category}</div>
          </div>
        </div>
        <div class="alert-detail-row">
          <div class="alert-detail-section">
            <div class="alert-detail-label">客户</div>
            <div class="alert-detail-value">${alert.customer || '-'}</div>
          </div>
          <div class="alert-detail-section">
            <div class="alert-detail-label">发送账号</div>
            <div class="alert-detail-value">${alert.account || '-'}</div>
          </div>
        </div>
        <div class="alert-detail-row">
          <div class="alert-detail-section">
            <div class="alert-detail-label">通道商</div>
            <div class="alert-detail-value">${alert.channelProvider || '-'}</div>
          </div>
          <div class="alert-detail-section">
            <div class="alert-detail-label">通道</div>
            <div class="alert-detail-value">${alert.channel}</div>
          </div>
        </div>
        <div class="alert-detail-section">
          <div class="alert-detail-label">告警来源</div>
          <div class="alert-detail-value">${alert.source}</div>
        </div>
        <div class="alert-detail-section">
          <div class="alert-detail-label">告警时间</div>
          <div class="alert-detail-value">${alert.time}</div>
        </div>
        <div class="alert-detail-section">
          <div class="alert-detail-label">阈值/当前值</div>
          <div class="alert-detail-value">
            <span style="color: #64748b;">阈值:</span> ${alert.threshold} 
            <span style="margin: 0 8px;">|</span> 
            <span style="color: #dc2626;">当前:</span> ${alert.currentValue}
          </div>
        </div>
        <div class="alert-detail-section">
          <div class="alert-detail-label">详细描述</div>
          <div class="alert-detail-desc">${alert.description}</div>
        </div>
        <div class="log-section">
          <h4><i class="fas fa-file-alt"></i> 详细日志信息</h4>
          ${logsHtml}
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
          <button class="btn btn-default" onclick="closeAlertDetailModal()">关闭</button>
        </div>
      `;

      document.getElementById('alertDetailBody').innerHTML = html;
      document.getElementById('alertDetailModal').style.display = 'flex';
    }

    function closeAlertDetailModal() {
      document.getElementById('alertDetailModal').style.display = 'none';
    }

    function exportAlerts() {
      const headers = ['ID', '级别', '标题', '客户', '发送账号', '通道商', '通道', '时间', '来源', '描述'];
      const rows = alertsData.map(item => [
        item.id,
        getLevelText(item.level),
        item.title,
        item.customer || '-',
        item.account || '-',
        item.channelProvider || '-',
        item.channel,
        item.time,
        item.source,
        item.description
      ]);

      const csvContent = [headers.join(','), ...rows.map(row => row.map(cell => `"${cell}"`).join(','))].join('\n');
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', `alerts_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('alertDetailModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeAlertDetailModal();
      }
    });

    renderAlerts(alertsData);
  </script>
